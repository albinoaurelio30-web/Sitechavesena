<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Favicon -->
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="robots" content="noindex">
<title>Serviço em pausa — Chaveiro Sena</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: #F4F5F7;
    color: #1A1D1F;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.6;
    min-height: 100vh;
  }
  .wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: #FFFFFF;
    border-radius: 16px;
    box-shadow: 0 2px 24px rgba(26, 29, 31, 0.07);
    max-width: 460px;
    width: 100%;
    padding: 40px 30px;
    text-align: center;
  }
  .barra {
    width: 48px;
    height: 4px;
    background: #5E7C7B;
    border-radius: 2px;
    margin: 0 auto 26px;
  }
  h1 {
    font-size: clamp(22px, 5.5vw, 28px);
    font-weight: 700;
    letter-spacing: -0.4px;
    line-height: 1.25;
    margin-bottom: 14px;
  }
  p { color: #6B6F73; font-size: 16px; }
  p + p { margin-top: 10px; }
  .marca {
    margin-top: 28px;
    padding-top: 18px;
    border-top: 1px solid #E6E8EB;
    color: #9AA0A6;
    font-size: 13px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="card">
    <div class="barra"></div>
    <h1>Serviço temporariamente em pausa</h1>
    <p>Este site está indisponível de momento.</p>
    <p>Voltamos em breve.</p>
    <p class="marca">Chaveiro Sena</p>
  </div>
</div>

<script>
// ---------------------------------------------------------------------------
// Registo de cliques no botao "Ligar" (links tel:) — 2026-09-15
// Alimenta a whitelist do anti-fraude: um IP que ja ligou e gente, e nunca deve
// ser bloqueado. Sem isto nao ha como validar a regra que bloqueia IPs, porque
// as conversoes sao chamadas medidas no Google Ads e nunca trazem IP.
// Backend: netlify/functions/log-call.js -> tabela call_clicks (Supabase).
// ---------------------------------------------------------------------------
(function () {
  var KEY = 'cs_gclid';

  // O gclid vem no URL da aterragem, mas o clique em "Ligar" pode acontecer
  // paginas a frente — por isso guarda-se na sessao.
  try {
    var g = new URLSearchParams(window.location.search).get('gclid');
    if (g) sessionStorage.setItem(KEY, g);
  } catch (e) {}

  function registarChamada() {
    var gclid = null;
    try { gclid = sessionStorage.getItem(KEY); } catch (e) {}
    var payload = JSON.stringify({ gclid: gclid, page: window.location.pathname });
    var url = '/.netlify/functions/log-call';

    // sendBeacon sobrevive a saida da pagina (abrir o marcador do telemovel).
    try {
      if (navigator.sendBeacon &&
          navigator.sendBeacon(url, new Blob([payload], { type: 'application/json' }))) {
        return;
      }
    } catch (e) {}

    // Plano B para browsers sem sendBeacon.
    try {
      fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: payload,
        keepalive: true
      }).catch(function () {});
    } catch (e) {}
  }

  // Captura para correr antes de qualquer handler que trave a propagacao.
  document.addEventListener('click', function (ev) {
    var alvo = ev.target;
    if (!alvo || typeof alvo.closest !== 'function') return;
    if (alvo.closest('a[href^="tel:"]')) registarChamada();
  }, true);
})();
</script>
</body>
</html>
