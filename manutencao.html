<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Favicon -->
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="robots" content="noindex">
<title>Serviço em pausa — Chaveiro Sena</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: #F4F5F7;
    color: #1A1D1F;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.6;
    min-height: 100vh;
  }
  .wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: #FFFFFF;
    border-radius: 16px;
    box-shadow: 0 2px 24px rgba(26, 29, 31, 0.07);
    max-width: 460px;
    width: 100%;
    padding: 40px 30px;
    text-align: center;
  }
  .barra {
    width: 48px;
    height: 4px;
    background: #5E7C7B;
    border-radius: 2px;
    margin: 0 auto 26px;
  }
  h1 {
    font-size: clamp(22px, 5.5vw, 28px);
    font-weight: 700;
    letter-spacing: -0.4px;
    line-height: 1.25;
    margin-bottom: 14px;
  }
  p { color: #6B6F73; font-size: 16px; }
  p + p { margin-top: 10px; }
  .marca {
    margin-top: 28px;
    padding-top: 18px;
    border-top: 1px solid #E6E8EB;
    color: #9AA0A6;
    font-size: 13px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="card">
    <div class="barra"></div>
    <h1>Serviço temporariamente em pausa</h1>
    <p>Este site está indisponível de momento.</p>
    <p>Voltamos em breve.</p>
    <p class="marca">Chaveiro Sena</p>
  </div>
</div>

</body>
</html>
