  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
  --gold: #F5A623;

  --bg: #0C0C0C;
  --bg2: #141414;

  }

  .light-theme {

  --bg2: #ececec;
  --bg3: #f5f5f5;
  --border: rgba(0,0,0,0.12);
  --text: #1a1a1a;
  --muted: #5a5a5a;
  background: var(--bg);
  color: var(--text);
  }
  .light-theme .btn-secondary { border-color: rgba(0,0,0,0.12); }
  .light-theme .btn-secondary:hover {
  border-color: rgba(0,0,0,0.25);
  background: rgba(0,0,0,0.04);
  }

  html { scroll-behavior: smooth; }
  body { font-family: 'Barlow', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }

  /* ── UTILS ── */
  .container { max-width: 1100px; margin: 0 auto; padding: 0 24px; }
  .tag { display: inline-block; background: rgba(245,166,35,0.12); color: var(--gold); border: 1px solid

  uppercase; padding: 4px 10px; }
  .display { font-family: 'Barlow Condensed', sans-serif; }

  /* ── STICKY HEADER ── */
  .sticky-bar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background: transparent;
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 32px;
  pointer-events: none; /* Let events pass through transparent areas */
  }
  .sticky-bar > * { pointer-events: auto; } /* Re-enable for content */
  .sticky-bar .logo {

  color: #FFF; text-shadow: 0 2px 12px rgba(0,0,0,0.4);

  font-family: 'Barlow', sans-serif; transition: background 0.2s;
  }

  /* ── HERO ── */

  display: flex; align-items: center;

  position: relative; overflow: hidden;

  background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.015'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
  pointer-events: none;
  }
  .hero-inner { display: flex; flex-direction: column; align-items: center; text-align: center; max-width: 800px;
  margin: 0 auto; width: 100%; }
  .hero-badge { margin-bottom: 20px; }
  .hero h1 {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: clamp(52px, 8vw, 88px);

  letter-spacing: -0.01em;
  margin-bottom: 24px;
  }
  .hero h1 em { color: var(--gold); font-style: normal; display: block; }
  .hero-sub { font-size: 18px; color: var(--muted); max-width: 600px; margin: 0 auto 36px; line-height: 1.6; }
  .hero-ctas { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-bottom: 48px; }
  @keyframes pulseCTA {

  }
  .btn-primary {
  background: var(--gold); color: #000; font-weight: 700; font-size: 17px;
  border: none; border-radius: 8px; padding: 16px 28px; cursor: pointer;
  text-decoration: none; display: inline-flex; align-items: center; gap: 10px;
  font-family: 'Barlow Condensed', sans-serif; letter-spacing: 0.02em; font-size: 18px;
  transition: all 0.2s;
  animation: pulseCTA 2s infinite ease-out;
  }
  .btn-primary:hover { background: #FFB733; transform: translateY(-1px); animation: none; }
  .btn-secondary {
  background: transparent; color: var(--text); font-weight: 600; font-size: 17px;
  border: 1px solid var(--border); border-radius: 8px; padding: 16px 28px; cursor: pointer;
  text-decoration: none; display: inline-flex; align-items: center; gap: 10px;
  transition: all 0.2s; font-family: 'Barlow', sans-serif;
  }
  .btn-secondary:hover { border-color: rgba(255,255,255,0.25); background: rgba(255,255,255,0.04); }
  .hero-stats { display: flex; justify-content: center; gap: 32px; }
  .hero-stat-num { font-family: 'Barlow Condensed', sans-serif; font-size: 32px; font-weight: 700; color: var(--gold);
  line-height: 1; }
  .hero-stat-label { font-size: 13px; color: var(--muted); margin-top: 2px; }

  /* HERO FORM CARD */
  .hero-form {
  background: var(--bg2); border: 1px solid var(--border); border-radius: 16px; padding: 32px;
  position: relative;
  }
  .hero-form::before {
  content: ''; position: absolute; top: -1px; left: 32px; right: 32px; height: 2px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }
  .hero-form h3 { font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 700; margin-bottom: 6px; }
  .hero-form p { font-size: 13px; color: var(--muted); margin-bottom: 20px; }
  .form-field { margin-bottom: 12px; }
  .form-field label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px;
  letter-spacing: 0.05em; text-transform: uppercase; }
  .form-field input, .form-field select, .form-field textarea {
  width: 100%; background: var(--bg3); border: 1px solid var(--border); color: var(--text);
  border-radius: 8px; padding: 12px 14px; font-size: 15px; font-family: 'Barlow', sans-serif;
  outline: none; transition: border-color 0.2s;
  }
  .form-field input:focus, .form-field select:focus, .form-field textarea:focus { border-color: rgba(245,166,35,0.5); }
  .form-field select option { background: var(--bg3); }
  .form-submit {
  width: 100%; background: var(--gold); color: #000; font-weight: 700;
  font-family: 'Barlow Condensed', sans-serif; font-size: 20px; letter-spacing: 0.02em;
  border: none; border-radius: 8px; padding: 16px; cursor: pointer;
  margin-top: 8px; transition: all 0.2s;
  }
  .form-submit:hover { background: #FFB733; }
  .form-disclaimer { font-size: 11px; color: var(--muted); text-align: center; margin-top: 10px; }

  /* ── TRUST BAR ── */
  .trust-bar { background: var(--bg2); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
  padding: 28px 24px; }
  .trust-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 0; }
  .trust-item {
  display: flex; align-items: center; gap: 10px; padding: 12px 28px;
  border-right: 1px solid var(--border);
  }
  .trust-item:last-child { border-right: none; }
  .trust-icon { width: 36px; height: 36px; background: rgba(245,166,35,0.1); border-radius: 8px; display: flex;
  align-items: center; justify-content: center; flex-shrink: 0; }
  .trust-icon svg { width: 18px; height: 18px; color: var(--gold); }
  .trust-label { font-size: 13px; font-weight: 600; line-height: 1.3; }
  .trust-sub { font-size: 11px; color: var(--muted); }

  /* ── SECTION COMMONS ── */
  section { padding: 96px 24px; }
  .section-header { text-align: center; margin-bottom: 60px; }
  .section-header .tag { margin-bottom: 16px; }
  .section-header h2 { font-family: 'Barlow Condensed', sans-serif; font-size: clamp(36px, 5vw, 56px); font-weight: 800;
  line-height: 1; margin-bottom: 16px; }
  .section-header p { font-size: 17px; color: var(--muted); max-width: 540px; margin: 0 auto; }

  /* ── SERVICES ── */
  .services { background: var(--bg); }
  .services-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2px; background:
  var(--border); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; max-width: 1100px; margin: 0
  auto; }
  .service-card { background: var(--bg2); padding: 32px 28px; transition: background 0.2s; cursor: default; }
  .service-card:hover { background: var(--bg3); }
  .service-icon { width: 52px; height: 52px; background: rgba(245,166,35,0.1); border-radius: 12px; display: flex;
  align-items: center; justify-content: center; margin-bottom: 20px; }
  .service-icon svg { width: 26px; height: 26px; color: var(--gold); }
  .service-card h3 { font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 700; margin-bottom: 8px;
  }
  .service-card p { font-size: 14px; color: var(--muted); line-height: 1.6; margin-bottom: 16px; }
  .service-price { font-size: 13px; color: var(--gold); font-weight: 600; }

  /* ── HOW IT WORKS ── */
  .how { background: var(--bg2); }
  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; max-width: 900px; margin: 0 auto; position:
  relative; }
  .steps::before { content: ''; position: absolute; top: 36px; left: calc(16.67% + 16px); right: calc(16.67% + 16px);
  height: 1px; background: linear-gradient(90deg, var(--gold), rgba(245,166,35,0.3), var(--gold)); }
  .step { text-align: center; padding: 0 24px; }
  .step-num { width: 72px; height: 72px; border-radius: 50%; border: 2px solid var(--gold); background: var(--bg);
  display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; font-family: 'Barlow Condensed',
  sans-serif; font-size: 28px; font-weight: 700; color: var(--gold); position: relative; z-index: 1; }
  .step h3 { font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 700; margin-bottom: 10px; }
  .step p { font-size: 14px; color: var(--muted); }
  .step-highlight { color: var(--gold); font-weight: 600; }

  /* ── URGENCY BANNER ── */
  .urgency-banner {
  background: linear-gradient(135deg, rgba(245,166,35,0.12) 0%, rgba(245,166,35,0.04) 100%);
  border: 1px solid rgba(245,166,35,0.2); border-radius: 16px;
  padding: 48px; text-align: center; max-width: 800px; margin: 0 auto;
  }
  .urgency-phone { font-family: 'Barlow Condensed', sans-serif; font-size: clamp(48px, 8vw, 72px); font-weight: 900;
  color: var(--gold); letter-spacing: -0.02em; line-height: 1; display: block; text-decoration: none; }
  .urgency-phone:hover { color: #FFB733; }

  /* ── COVERAGE ── */
  .coverage { background: var(--bg); }
  .coverage-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; max-width:
  900px; margin: 0 auto; }
  .coverage-item { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px;
  font-size: 14px; font-weight: 500; text-align: center; transition: all 0.2s; }
  .coverage-item:hover { border-color: rgba(245,166,35,0.4); color: var(--gold); }
  .coverage-item.highlight { border-color: rgba(245,166,35,0.3); color: var(--gold); }

  /* ── PRICING ── */
  .pricing { background: var(--bg2); }
  .pricing-table { max-width: 800px; margin: 0 auto; background: var(--bg3); border: 1px solid var(--border);
  border-radius: 16px; overflow: hidden; }
  .pricing-row { display: grid; grid-template-columns: 1fr auto; align-items: center; padding: 18px 28px; border-bottom:
  1px solid var(--border); transition: background 0.15s; }
  .pricing-row:last-child { border-bottom: none; }
  .pricing-row:hover { background: rgba(255,255,255,0.02); }
  .pricing-row.header { background: rgba(245,166,35,0.06); padding: 14px 28px; }
  .pricing-service { font-size: 15px; font-weight: 500; }
  .pricing-detail { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .pricing-val { font-family: 'Barlow Condensed', sans-serif; font-size: 18px; font-weight: 600; color: var(--gold);
  text-align: right; }
  .pricing-note { text-align: center; margin-top: 20px; font-size: 13px; color: var(--muted); }

  /* ── REVIEWS ── */
  .reviews { background: var(--bg); }
  .reviews-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; max-width:
  1000px; margin: 0 auto; }
  .review-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 16px; padding: 28px; }
  .review-stars { display: flex; gap: 3px; margin-bottom: 14px; }
  .star { width: 16px; height: 16px; color: var(--gold); }
  .review-text { font-size: 15px; color: var(--text); line-height: 1.6; margin-bottom: 20px; font-style: italic; }
  .review-author { display: flex; align-items: center; gap: 12px; }
  .review-avatar { width: 40px; height: 40px; border-radius: 50%; background: rgba(245,166,35,0.15); display: flex;
  align-items: center; justify-content: center; font-weight: 700; font-size: 16px; color: var(--gold); font-family:
  'Barlow Condensed', sans-serif; }
  .review-name { font-weight: 600; font-size: 14px; }
  .review-meta { font-size: 12px; color: var(--muted); }
  .google-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); margin-top:
  4px; }

  /* ── FAQ ── */
  .faq { background: var(--bg2); }
  .faq-list { max-width: 740px; margin: 0 auto; }
  .faq-item { border-bottom: 1px solid var(--border); }
  .faq-q { width: 100%; background: none; border: none; color: var(--text); text-align: left; padding: 22px 0;
  font-size: 16px; font-weight: 600; cursor: pointer; display: flex; justify-content: space-between; align-items:
  center; gap: 16px; font-family: 'Barlow', sans-serif; }
  .faq-q svg { width: 18px; height: 18px; color: var(--gold); flex-shrink: 0; transition: transform 0.3s; }
  .faq-a { max-height: 0; overflow: hidden; transition: max-height 0.3s ease, padding 0.2s; font-size: 15px; color:
  var(--muted); line-height: 1.7; }
  .faq-item.open .faq-a { max-height: 300px; padding-bottom: 20px; }
  .faq-item.open .faq-q svg { transform: rotate(45deg); }

  /* ── FINAL CTA ── */
  .final-cta {
  background: radial-gradient(ellipse 70% 80% at 50% 50%, rgba(245,166,35,0.08) 0%, transparent 70%), var(--bg);
  padding: 120px 24px; text-align: center;
  }
  .final-cta h2 { font-family: 'Barlow Condensed', sans-serif; font-size: clamp(40px, 6vw, 72px); font-weight: 900;
  line-height: 1; margin-bottom: 24px; }
  .final-cta h2 span { color: var(--gold); }
  .final-cta p { font-size: 18px; color: var(--muted); margin-bottom: 40px; }
  .cta-row { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; }

  /* ── FOOTER ── */
  footer { background: var(--bg2); border-top: 1px solid var(--border); padding: 64px 24px 32px; color: var(--text); }
  .footer-inner { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: 1.5fr 1fr 1fr; gap: 48px; }
  .footer-col-title { font-weight: 600; font-size: 16px; margin-bottom: 24px; color: #FFF; }
  .footer-logo { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 24px; margin-bottom: 20px; }
  .footer-logo span { color: var(--gold); }
  .footer-desc { color: var(--muted); font-size: 15px; margin-bottom: 20px; line-height: 1.6; }
  .footer-links { display: flex; flex-direction: column; gap: 14px; }
  .footer-links a { font-size: 14px; color: var(--muted); text-decoration: none; transition: color 0.2s; }
  .footer-links a:hover { color: var(--gold); }
  .footer-contacts { display: flex; flex-direction: column; gap: 16px; font-size: 14px; color: var(--muted); }
  .footer-contact-item { display: flex; gap: 12px; align-items: flex-start; }
  .footer-contact-item svg { width: 18px; height: 18px; color: var(--gold); flex-shrink: 0; margin-top: 2px; }
  .footer-bottom { max-width: 1100px; margin: 48px auto 0; padding-top: 24px; border-top: 1px solid var(--border);
  text-align: center; font-size: 13px; color: var(--muted); }

  /* ── WHATSAPP FLOAT ── */
  .whatsapp-btn {
  position: fixed; bottom: 28px; right: 28px; z-index: 200;
  width: 60px; height: 60px; border-radius: 50%; background: #25D366;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 24px rgba(37,211,102,0.35); text-decoration: none;
  transition: transform 0.2s;
  }
  .whatsapp-btn:hover { transform: scale(1.08); }
  .whatsapp-btn svg { width: 30px; height: 30px; color: #fff; }

  /* ── RESPONSIVE ── */
  @media (max-width: 768px) {
  .sticky-bar { padding: 12px 16px; }
  .hero-form { margin: 0 16px; }
  .trust-item { border-right: none; padding: 10px 16px; }
  .trust-grid { gap: 0; }
  .steps { grid-template-columns: 1fr; }
  .steps::before { display: none; }
  .pricing-row { grid-template-columns: 1fr auto; }
  .footer-inner { grid-template-columns: 1fr; gap: 40px; text-align: left; }
  .footer-links { align-items: flex-start; }
  }
  <script>
  (function () {
    var params = new URLSearchParams(window.location.search);
    var gclid = params.get('gclid');
    if (!gclid) return;

    // esconde a página enquanto valida
    document.documentElement.style.visibility = 'hidden';

    fetch('/.netlify/functions/validate-gclid', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ gclid: gclid })
    })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.valid === false && data.replay === true) {
          // GCLID replay confirmado — página em branco
          document.body.innerHTML = '';
          document.title = '';
          // mantém a página escondida
        } else {
          // legítimo — mostra a página normalmente
          document.documentElement.style.visibility = 'visible';
        }
      })
      .catch(function () {
        // erro na função — fail open, mostra a página
        document.documentElement.style.visibility = 'visible';
      });
  })();
  </script>
